# 訂正の登録簿。
#
# 公開したあとで誤りが見つかったもの、撤回したもの、果たされなかった約束を、
# **一件ずつ、消さずに**記録する。build.py が REGISTER.md を組み立て、
# verification/ が中身を検査する。
#
# 状態は次の五つだけ。ほかは使わない。
#
#   standing      いまも立っている主張
#   corrected     誤りが見つかり、直したもの
#   withdrawn     取り下げたもの。元の記述は消していない
#   unresolvable  直せないもの。凍結された成果物の側に誤りがある
#   open          未解決。まだ判断がついていない
#
# **id は永久に消さない。**過去のどの版にあった id も、いまの版に無ければ
# check_register.py が落とす。都合の悪い記録は、消せない作りにしてある。
#
# **弱まった主張も、消さない。状態も変えない。**立っている主張に反証が出たが
# 覆すには届かなかったとき、`counter` の欄に足す。standing のまま置く。
# withdrawn は「取り下げた」であって「弱まった」ではない。**両者を混ぜると、
# 弱まった時点でこっそり畳めるようになる。**counter を持つ項目は standing であり、
# refute（覆し方）を保っていなければならない —— そこも機械が当たる。
#
# 日付は二つある。混ぜない。
#
#   occurred  出来事が起きた時点。誤りが印字された日、撤回した改訂の月など
#   recorded  この登録簿に書いた日。**git の履歴から検証している。**
#             その id が register.toml に最初に現れたコミットの日付と
#             一致しなければ check_register.py が落ちる。ここは詐称できない
#
# そして basis が、その記録が同時のものか、あとからの再構成かを述べる。
#
#   同時    出来事の時点で記録した（recorded − occurred が 1 日以内）
#   再構成  あとから書き起こした。当時の記録ではない
#
# verifiable は、**第三者が確かめられるかどうか**を述べる。
#
#   紙面    凍結された PDF・git の履歴・走らせられるコードから、誰でも確かめられる
#   証言    著者の言葉以外に根拠が無い。**反証もできない**
#
# **重い項目ほど証言の側にある。**初稿の出所も、原典を読んでいないことも、
# 英訳の道具も、著者が言わなければ存在しなかったのと同じである（ST-003）。
#
# **71 件のうち 31 件は再構成である。**2025年10月から2026年8月までの
# 出来事は、起きた時点では記録していない。道筋を主張するなら、
# どこまでが同時記録でどこからが記憶なのかを先に書いておく必要がある。

