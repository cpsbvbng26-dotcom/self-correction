name: 検査

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 読むだけで足りる。書き込みの権限は、要る仕事にだけ名指しで渡す。
permissions:
  contents: read

jobs:
  verify:
    name: 登録簿 47 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 消した id を捕まえるため、履歴が要る。
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      # 依存パッケージなし。標準ライブラリだけで動く。
      - name: 登録簿の形と履歴
        run: python3 verification/check_register.py
      - name: データセットとしての形（CSV・データ辞書・datapackage.json・絞り込んだ頁）
        run: python3 verification/check_dataset.py
      - name: 人が読む版・CSV・絞り込んだ頁が作り直せる
        run: |
          python3 build.py
          git diff --exit-code -- REGISTER.md data/register.csv views/
          test -z "$(git status --porcelain -- views/ data/)"
